name: Static analysis

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read


# The presets in presets/* are consumed as `path` repositories and each requires
# laranail/license-verifier-ui ^0.1 back. On a pull request Composer sees the root
# package as dev-<merge-sha>, which no semver constraint matches, and the
# extra.branch-alias only covers dev-main. Telling Composer what version the root
# is resolves it -- see https://getcomposer.org/dep-on-root.
env:
  COMPOSER_ROOT_VERSION: '0.1.0'

jobs:
  analyse:
    name: Pint · PHPStan · Rector
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, pdo, sqlite3, pdo_sqlite, sodium
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --no-interaction --no-progress

      - name: Pint (lint)
        run: vendor/bin/laranail-pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Rector (dry-run)
        run: vendor/bin/rector process --dry-run --no-progress-bar
