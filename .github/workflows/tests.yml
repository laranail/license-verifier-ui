name: Tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read


# The presets in presets/* are consumed as `path` repositories and each requires
# laranail/license-verifier-ui ^0.1 back. On a pull request Composer sees the root
# package as dev-<merge-sha>, which no semver constraint matches, and the
# extra.branch-alias only covers dev-main. Telling Composer what version the root
# is resolves it -- see https://getcomposer.org/dep-on-root.
env:
  COMPOSER_ROOT_VERSION: '0.1.0'

jobs:
  pest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, pdo, sqlite3, pdo_sqlite, sodium
          coverage: none
      - run: composer update --prefer-stable --no-interaction --no-progress
      - run: vendor/bin/pest --colors=always

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        preset: [vue, blade]
    name: JS (${{ matrix.preset }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: presets/${{ matrix.preset }}
      - run: npm test
        working-directory: presets/${{ matrix.preset }}
