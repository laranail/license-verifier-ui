name: Tests

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The presets in presets/* are consumed as `path` repositories and each requires
# laranail/license-verifier-ui ^0.1 back. On a pull request Composer sees the root
# package as dev-<merge-sha>, which no semver constraint matches, and the
# extra.branch-alias only covers dev-main. Telling Composer what version the root
# is resolves it -- see https://getcomposer.org/dep-on-root.
env:
  COMPOSER_ROOT_VERSION: '0.1.0'

jobs:
  pest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        # prefer-lowest is what actually installs the floor composer.json declares.
        # Without it nothing ever resolves the minimum this package tells consumers
        # it supports. Paired with --prefer-stable because bare --prefer-lowest
        # resolves the lowest UNSTABLE release, which fails for the wrong reason.
        stability: [prefer-lowest, prefer-stable]
    name: PHP ${{ matrix.php }} · ${{ matrix.stability }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, fileinfo, pdo, sqlite3, pdo_sqlite, sodium
          coverage: none
      - name: Resolve composer cache directory
        id: composer-cache
        shell: bash
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restore composer cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Drop cached laranail archives
        # laranail/* resolve through a single MOVING v0.1.0 tag, so composer's dist
        # cache is keyed on a name whose contents change underneath it. A restored
        # archive is then silently stale: the install reports success and unpacks
        # whatever was cached the first time. Everything else is immutable per
        # version and stays cached.
        # POSIX command via bash: Windows runners default to PowerShell, where this
        # would be a parse error rather than a no-op.
        shell: bash
        run: rm -rf "$(composer config cache-files-dir)/laranail"

      - run: composer update --${{ matrix.stability }} --prefer-stable --prefer-stable --no-interaction --no-progress
      - run: vendor/bin/pest --colors=always

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        preset: [vue, blade]
    name: JS (${{ matrix.preset }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: presets/${{ matrix.preset }}
      - run: npm test
        working-directory: presets/${{ matrix.preset }}
